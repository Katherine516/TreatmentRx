[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "treatmentrx"
version = "0.1.0"
description = "Research-stage clinical decision-support agent for sequential treatment decisions"
# 3.9 is what the project is developed and run against; the code stays
# 3.9-compatible (deferred annotations, no `match`, no runtime PEP 604 unions).
requires-python = ">=3.9"
authors = [{ name = "TreatmentRx" }]
dependencies = []

[project.scripts]
treatmentrx = "treatmentrx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
